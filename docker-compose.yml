services:
  backend:
    build:
      context: ./whisper_server/backend
      dockerfile: Dockerfile
      args:
        BASE_PYTHON: python:3.11-slim
    container_name: whisper_backend
    restart: unless-stopped
    env_file:
      - ./whisper_server/backend/.env
    environment:
      # 覆盖容器内的持久化路径和允许来源
      DATABASE_URL: sqlite:////app/data/database/Server.db
      UPLOADS_DIR: /app/data/uploads
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://26.201.54.147:8080
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./whisper_server/data/database:/app/data/database
      - ./whisper_server/data/uploads:/app/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./whisper_client/frontend
      dockerfile: Dockerfile
      args:
        BASE_NODE: node:18-alpine
        BASE_NGINX: nginx:alpine
    container_name: whisper_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: whisper_net