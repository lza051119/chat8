services:
  backend:
    build:
      context: ./whisper_server/backend
      dockerfile: Dockerfile
      args:
        # 使用国内镜像源，避免访问 docker.io 认证端点
        BASE_PYTHON: m.daocloud.io/library/python:3.11-slim
    container_name: whisper-backend
    restart: unless-stopped
    env_file:
      - ./whisper_server/backend/.env
    environment:
      # 覆盖容器内的持久化路径和允许来源
      DATABASE_URL: sqlite:////app/data/database/Server.db
      UPLOADS_DIR: /app/data/uploads
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://26.201.54.147:8080
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./whisper_server/data/database:/app/data/database
      - ./whisper_server/data/uploads:/app/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./whisper_client/frontend
      dockerfile: Dockerfile
      args:
        BASE_NODE: m.daocloud.io/library/node:18-alpine
        BASE_NGINX: m.daocloud.io/library/nginx:alpine
    container_name: whisper-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

networks:
  default:
    name: whisper-net