services:
  backend:
    image: ${REGISTRY_DOMAIN}/${IMAGE_PREFIX}/whisper-backend:latest
    container_name: whisper-backend
    restart: unless-stopped
    env_file:
      - ./whisper_server/backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/database/Server.db
      UPLOADS_DIR: /app/data/uploads
      HOST: 0.0.0.0
      PORT: 8000
      # 在启动时传入实际允许的来源（例如 http://your-ip:8080 或 https://your-domain）
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./whisper_server/data/database:/app/data/database
      - ./whisper_server/data/uploads:/app/data/uploads
    ports:
      - "8000:8000"

  frontend:
    image: ${REGISTRY_DOMAIN}/${IMAGE_PREFIX}/whisper-frontend:latest
    container_name: whisper-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

networks:
  default:
    name: whisper-net