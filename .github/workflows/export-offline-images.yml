name: Export Offline Docker Images (Whisper)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (amd64 recommended)"
        type: choice
        options:
          - amd64
        default: amd64

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (amd64)
        run: |
          docker build \
            --build-arg BASE_PYTHON=python:3.11-slim \
            -t whisper-backend:latest \
            ./whisper_server/backend

      - name: Build frontend image (amd64)
        run: |
          docker build \
            --build-arg BASE_NODE=node:18-alpine \
            --build-arg BASE_NGINX=nginx:alpine \
            -t whisper-frontend:latest \
            ./whisper-client/frontend

      - name: Export backend as tar.gz
        run: |
          docker save whisper-backend:latest | gzip -c > whisper-backend_${{ inputs.arch }}.tar.gz
          ls -lh whisper-backend_${{ inputs.arch }}.tar.gz

      - name: Export frontend as tar.gz
        run: |
          docker save whisper-frontend:latest | gzip -c > whisper-frontend_${{ inputs.arch }}.tar.gz
          ls -lh whisper-frontend_${{ inputs.arch }}.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-offline-images-${{ inputs.arch }}
          path: |
            whisper-backend_${{ inputs.arch }}.tar.gz
            whisper-frontend_${{ inputs.arch }}.tar.gz
          if-no-files-found: error