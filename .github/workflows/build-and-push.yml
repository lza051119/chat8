name: Build and Push Whisper Images

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./whisper_server/backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/whisper_backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./whisper_client/frontend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/whisper_frontend:latest